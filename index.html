<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praga en 4 días</title>
<meta name="description" content="Itinerarios de 4 días por Praga y mapa de 300 sitios recomendados por Honest Guide.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f4ef; --panel:#fffdf9; --ink:#1f1b16; --muted:#6b6258; --line:#e6dfd4;
  --accent:#b4451f; --accent-ink:#fff; --accent-soft:#f6e3da;
  --danger:#c0262d; --chip:#efe9df; --star:#d99a00; --route:#b4451f;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --panel:#1f1b16; --ink:#f2ece3; --muted:#a69c8f; --line:#352f27;
    --accent:#ec7a4f; --accent-ink:#1a0d06; --accent-soft:#3a2419;
    --danger:#ff6b6b; --chip:#2b261f; --star:#ffc53d; --route:#ec7a4f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#1f1b16; --ink:#f2ece3; --muted:#a69c8f; --line:#352f27;
  --accent:#ec7a4f; --accent-ink:#1a0d06; --accent-soft:#3a2419;
  --danger:#ff6b6b; --chip:#2b261f; --star:#ffc53d; --route:#ec7a4f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);height:100vh}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
#map{height:100%;background:var(--bg)}
header{padding:20px 20px 0}
h1{font:700 28px/1.1 Fraunces,Georgia,serif;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.sub a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:4px;padding:16px 20px 0;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:8px 10px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.scroll{overflow:auto;flex:1;padding:16px 20px 40px}
.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.alt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;text-align:left}
.alt b{display:block;font-size:14px}
.alt span{font-size:11.5px;color:var(--muted)}
.alt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.intro{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.days{display:flex;gap:6px;margin-bottom:14px}
.days button{flex:1;min-width:0;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 0;font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font:600 20px/1.2 Fraunces,Georgia,serif;margin:0 0 4px}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.meta a{font-weight:600;text-decoration:none}
ol.stops{list-style:none;margin:0;padding:0;position:relative}
ol.stops li{position:relative;padding:0 0 14px 40px;cursor:pointer}
ol.stops li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;border-left:2px dotted var(--line)}
ol.stops li:last-child::before{display:none}
.num{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.stop-name{font-weight:600;line-height:1.3;display:block;padding-top:3px}
.stop-c{font-size:13.5px;margin:2px 0 0}
.stop-j{font-size:12.5px;color:var(--muted);margin:4px 0 0;font-style:italic}
ol.stops li:hover .stop-name,ol.stops li.on .stop-name{color:var(--accent)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.danger[aria-pressed="true"]{background:var(--danger);color:#fff}
.count{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.count button{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px}
ul.res{list-style:none;margin:0;padding:0}
ul.res li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;cursor:pointer}
ul.res li:hover .rn{color:var(--accent)}
.rn{font-weight:600;line-height:1.3}
.rl{font-size:12px;color:var(--muted)}
.rt{font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.star{background:none;border:0;padding:0 2px;font-size:18px;line-height:1;color:var(--muted);flex:none;align-self:start}
.star[aria-pressed="true"]{color:var(--star)}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px}
.card ul{margin:0;padding-left:18px;font-size:13.5px}
.card li{margin:3px 0}
.card.danger{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.lnk{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.leaflet-container{font:inherit}
.tiles{filter:saturate(.75) sepia(.12)}
body.dark .tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;max-width:260px}
.pp b{display:block;font-size:14.5px;line-height:1.3;margin-bottom:4px}
.pp .pl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.pp p{margin:0 0 6px;font-size:13px}
.pp .acts{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pin{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--panel);font:700 13px Inter,sans-serif;display:grid;place-items:center;box-shadow:var(--shadow)}
.pin.on{transform:scale(1.25);background:var(--ink);color:var(--panel)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:var(--shadow)}
.dot.bad{background:var(--danger);border-radius:2px;transform:rotate(45deg);outline:2px solid var(--ink);outline-offset:-1px}
.dot.fav{background:var(--star)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:42vh 1fr;height:100dvh}
  #map{grid-row:1}
  .panel{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  header{padding:14px 16px 0}
  h1{font-size:22px}
  nav.tabs{padding:10px 16px 0}
  .scroll{padding:14px 16px 32px}
  .alt span{display:none}
}
</style>
</head>

          <h1>Praga en 4 días</h1>

<script>
const DATA = {"lists":[{"id":"8oLoXdGPRbqOI6Rk_WPhZg","name":"Prague 101","emoji":"❗","title":"❗ Prague 101 - just do this","desc":"The best of the best. If you just want one of each :)","url":"https://maps.app.goo.gl/9ynHjrXJygA3XvNa8"},{"id":"bFPybTBdQTyIHBNtcOXbuw","name":"50 things","emoji":"🔝","title":"🔝 50 things to do in Prague","desc":"If you really want a mix of 50 things, here you go.","url":"https://maps.app.goo.gl/xCHknq3ZNyf3mXAdA"},{"id":"9zQukv-mQIS8BtrTyq2ZuQ","name":"Hidden gems","emoji":"💎","title":"💎 Hidden gems","desc":"Places that we treasure. Many never featured on our videos.","url":"https://maps.app.goo.gl/E9ZMKBQxpJR2FdPk9"},{"id":"CSNmc9s4Sviv9L7VtmtWEg","name":"Gratis","emoji":"💸","title":"💸 Free entry","desc":"Great places, that have free entry.","url":"https://maps.app.goo.gl/eFkmxSKBPHjkU2F26"},{"id":"Y0Ia78GqRiKdvvlwEiLOqA","name":"Pubs","emoji":"🍻","title":"🍻 Pubs","desc":"Cool pubs for beer. Cheap, fancy, local, small, large, but always my fav.","url":"https://maps.app.goo.gl/iPBqC82xp1tfk2tH8"},{"id":"-clK5ogjTz-k6h0s-CbwMA","name":"Cafés","emoji":"☕","title":"☕ Café","desc":"Where to go sit or grab a coffee. Keep in mind, that I am no coffee expert, so these are more of unique places, that happen to serve coffee.","url":"https://maps.app.goo.gl/FTAAfwMhphVFTF7R8"},{"id":"ODm358rkSZKgU0qFbygHBw","name":"Cocina checa","emoji":"🇨🇿","title":"🇨🇿 Czech food/eats","desc":"Go here for some great local food!","url":"https://maps.app.goo.gl/vb61BCrfE2fsu3Ut7"},{"id":"kwpITfP1RamKAJkiDMp2rg","name":"Comedores","emoji":"🍽️","title":"🍽️ Cheap eats (canteen style)","desc":"Grab your tray, order what you want, and go find a free table. Our traditional tray table style cafeterias.","url":"https://maps.app.goo.gl/ZYgyXrxTsB2g4Ckk7"},{"id":"vTMS9HTpGF-gt_0Fjgvriw","name":"Menú del día","emoji":"📋","title":"DAILY MENU/DEAL","desc":"","url":"https://maps.app.goo.gl/cu6xxPmtKdj4f6xG9"},{"id":"Gbyuxe1JTsO_Gl-lQ6s8lg","name":"Fine dining","emoji":"🍴","title":"🍴Fine dining","desc":"Reservations recommended! Not only great food but interesting places.","url":"https://maps.app.goo.gl/EyWuDm3Qikq7J1jg6"},{"id":"8gM5-N613wgrAOJBGFagVlQ7TPjNHw","name":"Románticos","emoji":"❤️","title":"❤️ Romantic restaurants","desc":"Places for a date night out","url":"https://maps.app.goo.gl/nfvLM2oKFPwVGc538"},{"id":"oySmQ4MYCJSZd3sD9RvVni1fDnNLLg","name":"Desayunos","emoji":"🍳","title":"🍳 Breakfast/brunch","desc":"Where to get some great morning food","url":"https://maps.app.goo.gl/cX3oiBSroG4a81Tg6"},{"id":"PbtE7BfFRwCxbibCfqyNed2aZGjQAw","name":"Asiático","emoji":"🥢","title":"🥢 My fav asian places","desc":"List of my favorite places to et, that are sort of “asian” cousin.","url":"https://maps.app.goo.gl/jJwNUTuoE8ieUi9K9"},{"id":"15f8Zkd-SvSOQn-diYNuUw","name":"Pizza","emoji":"🍕","title":"🍕 Pizza's","desc":"","url":"https://maps.app.goo.gl/bzjrvDgAKhw7XTx3A"},{"id":"P2oF4qtvSRmdVyDpPG8BHA","name":"Helados","emoji":"🍦","title":"🍦 Best ice cream","desc":"","url":"https://maps.app.goo.gl/9Dxtcw5UvhobwHLm6"},{"id":"YQUE0qTiTJ60CnBpI0hQqg","name":"Chlebíček","emoji":"🥐","title":"🥐 Chlebiček (czech sandwich)","desc":"Try the opened-face sandwich, our favorite!","url":"https://www.google.com/maps/placelists/list/YQUE0qTiTJ60CnBpI0hQqg"},{"id":"kDemCYuvRMadzHX1V_e8yg","name":"Souvenirs","emoji":"🎁","title":"🎁 Souvenirs","desc":"Where to buy some nice souvenirs or gifts from Prague.","url":"https://maps.app.goo.gl/DEZUPLQyYHCANNtd7"},{"id":"yUrpi7RlRiCD31fnOhSpXg","name":"Cines","emoji":"📽️","title":"📽️ Cool cinemas + bar","desc":"Small independent cinemas witch cool bars to discuss the film.","url":"https://maps.app.goo.gl/pJdz1Psi3NZZuJSN6"},{"id":"GcbdUWlaR8KTuoL7JWBaKQ","name":"Niños","emoji":"👶","title":"Prague with KIDS","desc":"","url":"https://maps.app.goo.gl/r8f2nZDQTL8QSQQz8"},{"id":"iPyl0ywgTCm0jGYTcZz74g","name":"Evitar","emoji":"❌","title":"❌SCAM❌TRAPS❌","desc":"This is for study purposes only! Do not go, or spend money at these places.","url":"https://maps.app.goo.gl/SA3tDwqUhBXhTvJz7"}],"places":[{"n":"Panna Maria z Exilu","lat":50.085617,"lon":14.391039,"notes":["best view, you will be alone (or with other user of this map)"],"l":["8oLoXdGPRbqOI6Rk_WPhZg"]},{"n":"Kayak Beach Bar","lat":50.066443,"lon":14.414724,"notes":["Hang out by the river or - even better, rent a kayak and enjoy the river! You can play/watch volleyball or use sauna in the winter","Under old railroad bridge there is actually a beach volleyball court and a place where you can rent kayaks and paddle boards. And it's also a bar :)"],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Střídačka (The Hockey Bench)","lat":50.088079,"lon":14.422725,"notes":["Just off Old town square. Owned by Czech hockey players. Therefore called the bench. Their food is also amazing!!"],"l":["8oLoXdGPRbqOI6Rk_WPhZg","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Na Hradbách","lat":50.063601,"lon":14.422008,"notes":["Great beer garden with epic views! It may seem far, but trust me (don't trust google maps), it is close enough to walk to!"],"l":["8oLoXdGPRbqOI6Rk_WPhZg"]},{"n":"Kavárna Adria","lat":50.082778,"lon":14.421944,"notes":["My favourite breakfast/brunch place. They open early and there is always a place to sit down. It does get busy during lunch, as there are many offices around. In the summer, the rooftop terrace is opened.","Paris style (large) coffe that opens early in the morning, so it's also great for breakfast. It only get's packed during lunch time, when locals head out to eat.","Large selection on the daily menu - not only czech foods. Also large terrace.","Place where I love going for breakfast. Nothing hipster, just regular Czech breakfast."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","vTMS9HTpGF-gt_0Fjgvriw","oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Restaurace Červený jelen","lat":50.087317,"lon":14.430851,"notes":["Old bank turned into a giant pub/restaurant. The best svíčková I've ever had. You can also order a \"plate\" to share. I took a few journalists here and they said it was the best meal they had in Prague.","Incredible space! Former bank, designed by the architect of the year, bartender Míra is the best guy (you can attend the tapster academy). The food is amazing but quite pricey (but the price meets the quality to be honest). Also, their cakes are top!","Higher prices but it is worth every crown. Huge opened kitchen."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA","ODm358rkSZKgU0qFbygHBw","Gbyuxe1JTsO_Gl-lQ6s8lg"]},{"n":"Automat Matuška","lat":50.098047,"lon":14.404286,"notes":["Craft beer place/brewery, owned by our dear friend Adam. Absolutely love it! There is a little square next to it, so you can drink outside. Younger crowd.","My absolute favourite beer and place to have it. Nice walk from the old town with some views thru a park will get you there. Have a California a stand outsde.","Awesome spot with many beers on tap. Very young crowd in a great neighborhood. Short walk from the city."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Kafe Damu","lat":50.0859,"lon":14.41721,"notes":["Honza says it's a bar, I (Janek) think it's more of a coffee place - and that's what describes most of the Prague places. Aynhow, this one if one of the very few local/student/great spots in downtown Prague.","One of very few local spots in the tourist hell."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Crème de la Crème","lat":50.085802,"lon":14.418236,"notes":["Fuck trdelnik (that pastry all the tourists are eating - locals hate it), have the best Ice Cream in town.","by far the best ice cream in the city (vegan options as well if you're wondering)","F**k trdelnik (that pastry all the tourists are eating - locals hate it), have the best Ice Cream in town."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","P2oF4qtvSRmdVyDpPG8BHA"]},{"n":"Na břehu Rhôny bistro Maltézské náměstí","lat":50.085735,"lon":14.405061,"notes":["Great little wine place that I love. They are the nicest people.","Nicest wine place I've been to in Prague. The service was outstanding."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Ovocný Světozor","lat":50.081833,"lon":14.424955,"notes":["Go here and have the traditional Czech Chlebíček (open faced sandwich). Have it to go, and eat it in the garden attached to the passage.","Great spot in the passage.","Great ice cream, cakes, and sandwiches. Take it to the near by garden."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","P2oF4qtvSRmdVyDpPG8BHA","YQUE0qTiTJ60CnBpI0hQqg"]},{"n":"Riegrovy Sady View","lat":50.079695,"lon":14.44023,"notes":["Go here for the sunset. In the summer it sets just behind the castle. Discover the neighborhood, as it is full of great venues. Also a beergarden 2min away."],"l":["8oLoXdGPRbqOI6Rk_WPhZg"]},{"n":"Lokál U Bílé kuželky","lat":50.087664,"lon":14.407539,"notes":["Have a beer and sit outside on the curb.","For the best Pilsner beer in town. Sit outside on the curb, my fav place, just off the Bridge.","I believe this is the best pub in Prague. Sit outside on the curb and have the best Pilsner in the world.","If you want to try the Czech classics made from great quality stuff, this is the place. Also best beer in town."],"l":["8oLoXdGPRbqOI6Rk_WPhZg","bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA","ODm358rkSZKgU0qFbygHBw"]},{"n":"Kantýna","lat":50.083504,"lon":14.428919,"notes":["Old bank turned into a pub. Became extremely popular lately, so be prepared for crowds on weekends and evenings.","Old bank turned into a pub/bistro. Grab a beer and stand by the giant marble table in the middle."],"l":["bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Scout Institute","lat":50.086667,"lon":14.419859,"notes":[],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Vítkov","lat":50.088767,"lon":14.451458,"notes":["One of the most beautiful views on Prague from the top of the monument building, opened everyday (except mondays) and it's FREE!!"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Dívčí hrady","lat":50.051063,"lon":14.404444,"notes":["Great view of the city, and near by there is a przewalski's horse. Also a great area for a hike or running."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Fantova kavárna Praha","lat":50.08313,"lon":14.43525,"notes":["Not your regular cafe inside the main train station. Also a new café opened right next door, called \"Foyer café\", must see!"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Čestr","lat":50.079549,"lon":14.432435,"notes":["This is for all the meat lovers out there - don't ask any questions and just come here, you'll thank me later."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"U Rarášků","lat":50.081535,"lon":14.417836,"notes":["Not only great spot for beer, but the courtyard that it's in is a must see.","Great inner block surrounded by a new building."],"l":["bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Parlour","lat":50.078605,"lon":14.428101,"notes":["Any Cocktail fans here? Well, this is your place - don't expect any menu. The bartender will simply ask you what do you like and that's it. He'll mix the perfect drink for you."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Popocafepetl - Michalska","lat":50.085348,"lon":14.419877,"notes":["The cheapest student's bar with crazy vibe. I really felt old there during my last visit."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Kafe & Hrnky","lat":50.08841,"lon":14.399071,"notes":["On your way up to the castle, get coffee and something to eat. You can also make yourself a little mug."],"l":["bFPybTBdQTyIHBNtcOXbuw","-clK5ogjTz-k6h0s-CbwMA"]},{"n":"CAMP - Centrum architektury a městského plánování","lat":50.072882,"lon":14.418057,"notes":["Center of architecture with free entry and always free great exhibitions regarding the city and it's development."],"l":["bFPybTBdQTyIHBNtcOXbuw","CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Českavárna Portheimka","lat":50.07371,"lon":14.403982,"notes":["By far my favourite café in Prague, serves great breakfasts, located in a beautiful park next to a church."],"l":["bFPybTBdQTyIHBNtcOXbuw","-clK5ogjTz-k6h0s-CbwMA","oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"DOX Centre for Contemporary Art","lat":50.106815,"lon":14.447828,"notes":["Great art gallery with a giand wooden blimp :)"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Skautský institut v Rybárně","lat":50.082941,"lon":14.40798,"notes":["Place run by the Scouts, little cafe/bar place downstairs. Just across the park is a more \"adult\" place called Mlýnská. The entire island Kampa is worth discovering."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Rozhledna DOUBRAVKA XIV","lat":50.097257,"lon":14.557224,"notes":["Take a trip to unique wooden lookout tower. The stairs do not touch the ground.","Take a trip to unique wooden lookout tower. The stairs do not touch the ground. Entry is free."],"l":["bFPybTBdQTyIHBNtcOXbuw","CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Antonín's bakery","lat":50.075853,"lon":14.403849,"notes":["Great bakery with local products. Upstairs is a shop with board games.","My favourite bakery. Loaded with traditional Czech stuff for breakfast or quick bites."],"l":["bFPybTBdQTyIHBNtcOXbuw","oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Jizerske Pekarny","lat":50.088773,"lon":14.421703,"notes":["Small bakery with local prices on the touristy square. Try the Chlebíček."],"l":["bFPybTBdQTyIHBNtcOXbuw","YQUE0qTiTJ60CnBpI0hQqg"]},{"n":"420","lat":50.086793,"lon":14.421004,"notes":["Very fancy (pricey) restaurant by a Michelin star chef. The space will take your breath away.","A michelin star awarded chef just recently opened this new place in Prague on the old town square. Make sure to get table reservation in the main space (not the \"alley\"). Also, notice the St. John of Nepomuk statue."],"l":["bFPybTBdQTyIHBNtcOXbuw","Gbyuxe1JTsO_Gl-lQ6s8lg"]},{"n":"The Vrtba Garden","lat":50.086644,"lon":14.402878,"notes":["you have to pay an entrance fee but it's worth every penny (I mean Kč)"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Vyšehrad","lat":50.064194,"lon":14.418898,"notes":["The \"other\" castle. Great beer garden, famous people cemetery and great views."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Dim Sum Spot Palackého","lat":50.080988,"lon":14.42366,"notes":["great filled dumplings, hidden in a backyard (if you're tired of the Czech dumplings, give it a go)","Best steamed dumplings!"],"l":["bFPybTBdQTyIHBNtcOXbuw","PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Pivnice U Kata","lat":50.087318,"lon":14.419226,"notes":["Beer (and cash) only place in the city center. It's what you'd call a \"dive bar\".","Cash and beer only! My summer favorite. A real local dive bar."],"l":["bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Radlická Kulturní Sportovna","lat":50.067835,"lon":14.402915,"notes":["Great party/music venue. Honza had his wedding here, check programme."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"ROXY Prague","lat":50.090689,"lon":14.425874,"notes":["Great music venue. Check programme..."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"San Carlo Mala Strana","lat":50.087087,"lon":14.402804,"notes":["romantic pizzeria (neapol style pizza) and... yes, very romantic, you'll see","Definitely one of the best pizzas in Prague, again nicely hidden away from the main roads, nice garden in the summer."],"l":["bFPybTBdQTyIHBNtcOXbuw","8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Dva kohouti","lat":50.09349,"lon":14.446846,"notes":["Young crowd beer garden/brewery. If you're visiting with friends and like beer, this is the place to go to."],"l":["bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Petřínské sady","lat":50.082267,"lon":14.400494,"notes":["You may see the Petřín tower from the city, and some may told you about the funicular that goes to it. Well skip both and just walk around the park. In the spring it's beautiful, in the winter, if there's snow, it's full of kids."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Jídelna Světozor","lat":50.081741,"lon":14.425255,"notes":["Local \"tray style\" cafeteria in the underground. A local experience, if you're into it :) Food is cheap, but not crazy cheap.","An absolute staple of all Prague cheap dining rooms. The first tray table restaurant we visited, still great."],"l":["bFPybTBdQTyIHBNtcOXbuw","kwpITfP1RamKAJkiDMp2rg"]},{"n":"Prague Metronome","lat":50.094744,"lon":14.415941,"notes":["Very short walk from the city and a steep walk up the stairs rewards you with a great view."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"National Memorial on Vítkov Hill","lat":50.088478,"lon":14.449514,"notes":["No tourists, amazing view. Great area around."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Branická Formanka","lat":50.080262,"lon":14.423909,"notes":["a gem - local pub with the cheapest beer and amazing genius loci","Probably the cheapest beer in Prague, and a true dive bar. Please treat with respect :) many locals."],"l":["bFPybTBdQTyIHBNtcOXbuw","Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Statue of King Wenceslas Riding an Upside-Down Dead Horse","lat":50.080843,"lon":14.426419,"notes":["We're putting this on the list not only for the cool statue, but mainly so that you know, that Prague is full of passages that you can walk and get lost in. This one (Lucerna), is full of restaurants, cafes, shops. A small city, within a city."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Kuchyň","lat":50.089386,"lon":14.397968,"notes":["By far the best view from any restaurant in the city and on top of that a great restaurant. You can even just go in and grab a beer on the terrace (bottom part) (that's what I would do).","Superb food with great views (have a reservation for the garden, otherwise this place looses most of it's charm)."],"l":["bFPybTBdQTyIHBNtcOXbuw","ODm358rkSZKgU0qFbygHBw"]},{"n":"HolKa","lat":50.097481,"lon":14.448189,"notes":["Newest pedestrian bridge in Prague. The island that it crosses is worth discovering, especially in the summer."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Museum of Public Transport","lat":50.093865,"lon":14.389187,"notes":["Opened only on weekends, but if you like public transport as much as I do, it's a must!"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Kasárna Karlín","lat":50.089831,"lon":14.44342,"notes":["Venue, that has it all, pubs, playgrounds, summer screenings, cafes etc...  (as of july 24 temporarily closed)"],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Dish Belgická","lat":50.073062,"lon":14.436163,"notes":["According to the Honest Guides (that's us) - the best burger in Prague."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Točna Dlabačov","lat":50.085708,"lon":14.384625,"notes":["Our friends bought a tram and turned it into a bistro. In all honesty one of the coolest additions I know to the city lately.","Some guys bought a tram and turned it into a diner. Hop on the tram and ring the doorbell, flash the lights, have some fries, a soda or a beer. This is a real hidden gem!"],"l":["bFPybTBdQTyIHBNtcOXbuw","9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Střelecký ostrov","lat":50.080967,"lon":14.409968,"notes":["One of many Prague islands, tourists nicknamed it \"Beaver Island\" because of nutrias that they feed there."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Franciscan Gardens","lat":50.082083,"lon":14.423969,"notes":["Hidden garden in the city center. There are cafes around."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Old Town Bridge Tower","lat":50.086231,"lon":14.413614,"notes":["My fav view of the city. Sunset time is best, morning time (1st hour) is half price off."],"l":["bFPybTBdQTyIHBNtcOXbuw"]},{"n":"Galerie Portheimka","lat":50.074029,"lon":14.403964,"notes":["Must see hidden gem. Next to my fav café is a gallery (free entry!) and inside on the 1st floor most amazing baroque hall."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Bazén Terasy Barrandov","lat":50.036866,"lon":14.402609,"notes":["Abandoned swiming pool. Cool destination for a run or bike ride. Impressive in a way. Was here for the film studios that are above it."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Starý židovský hřbitov Praha - Smíchov","lat":50.058426,"lon":14.400483,"notes":["I only know of the existence of this jewish cemetery, thanks to the fact, that I live near by. If you want to take a walk around a local Villa neighbourhood, this can be your destination - beware the cemetery may be locked!"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Socha sv. Jana Nepomuckého","lat":50.088006,"lon":14.397298,"notes":["Hidden statue of St. John of Nepomuk that people touch on Charles Bridge. Hidden away in a dead end street. Worth a detour!"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Zahrady pod Pražským hradem","lat":50.090559,"lon":14.40598,"notes":["Amazing complex of 5 gardens (only 1ticket needed). Ideal for date"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Bethlehem Chapel in Žižkov","lat":50.085808,"lon":14.45391,"notes":["Cubist Chappel hidden inside a courtyard. Beautiful!!"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Pazdera Jan","lat":50.080772,"lon":14.425003,"notes":["I love old cameras, and this store is a true hidden gem for all us camera lovers."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Novak House","lat":50.080763,"lon":14.424892,"notes":["Inside the passage with the sign \"U NOVÁKŮ\" is where you will find the nonstop running Pater noster elevator :)"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Kryt Folimanka","lat":50.067753,"lon":14.43229,"notes":["Old civil shelter, really cool! Opened every 2nd Saturday of the month. 9-3pm."],"l":["9zQukv-mQIS8BtrTyq2ZuQ","CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Jezírko","lat":50.041707,"lon":14.385321,"notes":["Great place to go for a walk or a run, especially if you want to escape the buzz of the city centre"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Prague Southernmost Point","lat":49.941937,"lon":14.395503,"notes":["During Covid we marked all the poles of Prague together with our friend Ondra. I'll be honest, the northern one is not really worth visiting, the western and eastern ones are far away, so you can make a trip around at least to the southern one. It's beautiful there."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Maternity hospital Apolinář","lat":50.071465,"lon":14.42698,"notes":["Please be very respectful. This is a maternity hospital, but yes, this is the real-life HOGWARTS from Harry Potter. You can enter the garden as well; it's extremely beautiful."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"R2-D2 Ventilation Shaft (Folimanka Park Bunker)","lat":50.068509,"lon":14.431949,"notes":["If you're a Star Wars fan, it's a must!"],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Garden Café Taussig","lat":50.085909,"lon":14.394537,"notes":["This place is run by people with mental illnesses so please treat not only the place, but also it's workers with maximum respect."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Zahrada V Jirchářích","lat":50.080054,"lon":14.418252,"notes":["A beautiful hidden garden that my friend just showed me."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Výběh pro koně Převalského ZOO Praha","lat":50.049628,"lon":14.39297,"notes":["Part of the Prague ZOO but outside the ZOO. Just 15 minutes walk from Radlická metro station is this place where wild nature meets the city panorama (poetic, isn't it?). There are horses galloping and in the background is the most beautiful city in the world."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Our Lady of Exile","lat":50.085617,"lon":14.391039,"notes":["Most beautiful view of Prague that I know."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Palace YMCA","lat":50.089105,"lon":14.431341,"notes":["If you want to ride the paternoster (nonstop) elevator for free and without any problems, this is one of the few places in Prague where it is still possible. Enjoy."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Imbus cafe","lat":50.081354,"lon":14.417929,"notes":["The new café in the UMPRUM building (art school), you have to sign in at the concierge to get in (just write that you are going to the café) and it's great. Beer for 37 crowns, art students everywhere (a special group of nice people) and a huge courtyard."],"l":["9zQukv-mQIS8BtrTyq2ZuQ"]},{"n":"Muzeum Prahy - hlavní budova na Florenci","lat":50.089899,"lon":14.438435,"notes":["Old museum with new concept. If you want to see the only 200 year old model of Prague (very unique) here it is!"],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Czech Police Museum","lat":50.069151,"lon":14.428287,"notes":["The outside part of the museum is for free to enter and is worth it to see, cool stuff."],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Návštěvnické centrum ČNB","lat":50.086961,"lon":14.428257,"notes":["Czech national bank is opened to the public and for free. Learn about our currency and visit the vault. Great experience even for the kids!"],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Military History Institute in Prague: The Army Museum Žižkov","lat":50.087571,"lon":14.444668,"notes":[],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"St. Nicholas' Church","lat":50.087927,"lon":14.419913,"notes":["Baroque jewel in the hear of the city."],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Church of Our Lady before Týn","lat":50.087749,"lon":14.42254,"notes":["opened for free during the hours: 10-13, 15 - 17."],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Galerie Rudolfinum","lat":50.090155,"lon":14.415193,"notes":["Great gallery in the center. Check the schedule and current exhibits."],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Aircraft museum Prague-Kbely","lat":50.125256,"lon":14.535524,"notes":["Military/government airport's museum."],"l":["CSNmc9s4Sviv9L7VtmtWEg"]},{"n":"Station 6","lat":50.10729,"lon":14.404532,"notes":["Great ex-train station pub/bar. If you like trains, you’l love it."],"l":["Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Permanent Pragovka","lat":50.109158,"lon":14.512039,"notes":[],"l":["Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"Galerie piva","lat":50.070601,"lon":14.45081,"notes":["Must visit if you're a beer lover. Awesome hipster part of Prague"],"l":["Y0Ia78GqRiKdvvlwEiLOqA"]},{"n":"U Lučištníka","lat":50.055591,"lon":14.398279,"notes":[],"l" ing about it, and how great it was."],"l":["Gbyuxe1JTsO_Gl-lQ6s8lg"]},{"n":"Restaurant Mlýnec","lat":50.085409,"lon":14.413599,"notes":["Superb brunch with all-you-can-drink prosecco.","This isn't exactly your typical breakfast spot. It's more of for a fancy date, and it's also more of a brunch. A multi-course menu and unlimited juice and wine (prosseco). I've been twice now and can only recommend it. It costs 1400 per person, but trust me, it's a real treat."],"l":["Gbyuxe1JTsO_Gl-lQ6s8lg","oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"La Piccola Perla","lat":50.083546,"lon":14.421325,"notes":["Not as romantic as other venues but super cute italian place."],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"St.Martin","lat":50.087249,"lon":14.400077,"notes":["Beautiful garden and great food. A restaurant in a forgotten alley of the Tržiště street, where few people stray. I definitely recommend it!"],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Marina Ristorante","lat":50.089142,"lon":14.413791,"notes":["It's a bit more touristy and, looking at the menu now, a lot more expensive than on my last visit, but it's ultra romantic. (But I was considering putting it on the list). The views here are the real magic."],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Les Moules","lat":50.090627,"lon":14.418017,"notes":["I love mussels and Leffe beer and you can have both here. It's a little pricey, but nothing crazy. The seating is gorgeous both inside and outside on the patio."],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Vegan's Prague","lat":50.088578,"lon":14.398266,"notes":["Beautiful place in Nerudova street, that leads up to the Castle, if you are lucky enough to sit on the mini terrace, I definitely recommend it."],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Lehká hlava - vegetarian restaurant","lat":50.084075,"lon":14.414595,"notes":["Hidden place with lovely interior and great vegetarian food."],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Luka Lu","lat":50.083664,"lon":14.404198,"notes":["Most colorful place I know. Great food great owner!"],"l":["8gM5-N613wgrAOJBGFagVlQ7TPjNHw"]},{"n":"Café Louvre","lat":50.082069,"lon":14.418619,"notes":["Ultra popular place, so go early, to avoid the lines!"],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"BA-LĂM Coffee","lat":50.094939,"lon":14.456067,"notes":["The food is superb! Will blow your mind!","Great breads, coffee and breakfast! Turkish eggs and kimchi bread were amazing!"],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg","PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"The Miners Coffee Charles Bridge","lat":50.087196,"lon":14.405968,"notes":["New spot (chain) with decent breakfast. It looked small at first glance but I was satisfied. The good part is that they open at 8am."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Zrno zrnko","lat":50.064273,"lon":14.44345,"notes":["This is a true bakery. We discovered it thanks to places, that they supply with their bread. Worth a trip."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"The Spot Malá Strana","lat":50.078089,"lon":14.404377,"notes":["I tried the newly opened place with my girlfriend. English breakfast, spinach pancake, and veggie sandwich. All perfect! Huge place, can't imagine it filling up + the courtyard garden. Prices were surprisingly low, but that will probably change."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Cafe des Taxis","lat":50.089981,"lon":14.409091,"notes":["To be honest, I don't know if it's more of a cafe or a breakfast place, but definitely check it out. It's a Bistro run by students from the US, so it's like a trip to America, but on the Malá Strana. Super hidden and the prices great."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Kavárna co hledá jméno","lat":50.069754,"lon":14.403913,"notes":["Their eggs benedict are now legendary. The café where I helped with the realization (I scraped the plaster). If you don't know I definitely recommend it. Next door is Manifesto, which I don't like."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Mezi Srnky Smíchov","lat":50.076208,"lon":14.404414,"notes":["Hipsterish. Your girl's Instagram will love it."],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Bistro Monk","lat":50.085906,"lon":14.420025,"notes":["Fancy place, also very popular among tourists, so quite often a line. I used to go, when it was \"unknown\" :)"],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Spižírna 1902","lat":50.075288,"lon":14.452679,"notes":["Gorgeous interior (and a bit of a hipster-ish)"],"l":["oySmQ4MYCJSZd3sD9RvVni1fDnNLLg"]},{"n":"Yangguofu Malatang (杨国福布拉格店)","lat":50.083229,"lon":14.421545,"notes":["You make the food yourself. Super helpful staff. Bit on the pricey side."],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"An bistro cafe","lat":50.098009,"lon":14.403531,"notes":[],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"NAPOKĒ Italská","lat":50.084411,"lon":14.439967,"notes":["One of best pokes in Prague. Also build your own"],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Nhà hai hành","lat":50.077392,"lon":14.40234,"notes":[],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Mamam Bistro","lat":50.074066,"lon":14.438226,"notes":["Brand new hip bistro. Amazing food and interiour."],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"OISHI HOUSE","lat":50.081409,"lon":14.419321,"notes":["I always get a Ramen. The interior is crazy and staff is more then amazing!"],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Dim Sum Spot & Pub Anděl","lat":50.072252,"lon":14.406671,"notes":["Best dumplings! And they have surprisingly good tap beer selection"],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Národní 38","lat":50.082508,"lon":14.421626,"notes":["One of the best Bun bo Nam bo I ever had!"],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"Vietnam SH fast food (Anděl)","lat":50.071546,"lon":14.405707,"notes":["Best vietnamese in this part of town."],"l":["PbtE7BfFRwCxbibCfqyNed2aZGjQAw"]},{"n":"The Nest","lat":50.077955,"lon":14.418701,"notes":["One of the finest and best Asian places let favs = new Set(store.get("praga.favs", []));

// Theme
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const savedTheme = store.get("praga.theme", null);
if (savedTheme) root.dataset.theme = savedTheme;

// Map
const map = L.map("map", {zoomControl:true}).setView([50.083, 14.42], 14);
let tiles;
function setTiles(){
  document.body.classList.toggle("dark", isDark());
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, className:"tiles",
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
}
setTiles();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.dataset.theme) setTiles(); });
document.getElementById("theme").onclick = () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  store.set("praga.theme", root.dataset.theme);
  setTiles(); render();
};

const layer = L.layerGroup().addTo(map);
const markers = new Map();

function popupHtml(p, extra){
  const lists = p.l.map(id => `${L_BY_ID[id].emoji} ${esc(L_BY_ID[id].name)}`).join(" · ");
  const notes = p.notes.map(n => `<p>“${esc(n)}”</p>`).join("");
  return `<div class="pp"><b>${esc(p.n)}</b><div class="pl">${lists}</div>${extra ? `<p><strong>${esc(extra)}</strong></p>` : ""}${notes}
    <div class="acts"><a href="${gmaps(p)}" target="_blank" rel="noopener">Abrir en Google Maps ↗</a>
    <button class="star" data-fav="${esc(p.n)}" aria-pressed="${favs.has(p.n)}" title="Favorito">★</button></div></div>`;
}

function toggleFav(name){
  favs.has(name) ? favs.delete(name) : favs.add(name);
  store.set("praga.favs", [...favs]);
  document.querySelectorAll(`[data-fav="${CSS.escape(name)}"]`).forEach(b => b.setAttribute("aria-pressed", favs.has(name)));
  if (state.tab === "ex") drawExplore(false);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fav]");
  if (b){ e.stopPropagation(); toggleFav(b.dataset.fav); }
});

function focusPlace(name){
  const m = markers.get(name);
  if (!m) return;
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), {duration:.6});
  m.openPopup();
}

function dist(a, b){
  const R = 6371, r = Math.PI/180;
  const dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// Views
const view = document.getElementById("view");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  save();
  if (state.tab === "it") renderItin();
  else if (state.tab === "ex") renderExplore();
  else renderInfo();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; view.scrollTop = 0; render(); });

function renderItin(){
  const alt = ITIN.find(a => a.id === state.alt) || ITIN[0];
  const day = alt.days[state.day] || alt.days[0];
  const stops = day.stops.map(([n, c]) => ({p:P[n], c}));
  let km = 0;
  for (let i = 1; i < stops.length; i++) km += dist(stops[i-1].p, stops[i].p);
  const dirUrl = "https://www.google.com/maps/dir/" + stops.map(s => `${s.p.lat},${s.p.lon}`).join("/") + "/data=!4m2!4m1!3e2";
  view.innerHTML = `
    <div class="alts">${ITIN.map(a => `<button class="alt" data-alt="${a.id}" aria-pressed="${a.id === alt.id}"><b>${a.id} · ${esc(a.name)}</b><span>${esc(a.tag)}</span></button>`).join("")}</div>
    <p class="intro">${esc(alt.intro)}</p>
    <div class="days">${alt.days.map((d, i) => `<button data-day="${i}" aria-pressed="${i === state.day}">Día ${i+1}</button>`).join("")}</div>
    <h2>${esc(day.title)}</h2>
    <div class="meta">${day.noRoute ? `<span>Opciones sueltas, sin ruta</span>` : `<span>${stops.length} paradas</span><span>~${km.toFixed(1)} km en línea recta</span><a href="${dirUrl}" target="_blank" rel="noopener">Ruta a pie en Google Maps ↗</a>`}</div>
    <ol class="stops">${stops.map((s, i) => `
      <li data-place="${esc(s.p.n)}"><span class="num">${i+1}</span>
        <span class="stop-name">${esc(s.p.n)}</span>
        <p class="stop-c">${esc(s.c)}</p>
        ${s.p.notes[0] ? `<p class="stop-j">“${esc(s.p.notes[0])}”</p>` : ""}
      </li>`).join("")}</ol>`;
  view.querySelectorAll("[data-alt]").forEach(b => b.onclick = () => { state.alt = b.dataset.alt; state.day = 0; render(); });
  view.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { state.day = +b.dataset.day; render(); });
  view.querySelectorAll("li[data-place]").forEach(li => li.onclick = () => focusPlace(li.dataset.place));

  layer.clearLayers(); markers.clear();
  const pts = stops.map(s => [s.p.lat, s.p.lon]);
  if (!day.noRoute) L.polyline(pts, {color:getComputedStyle(root).getPropertyValue("--route").trim(), weight:3, opacity:.7, dashArray:"6 6"}).addTo(layer);
  stops.forEach((s, i) => {
    const m = L.marker([s.p.lat, s.p.lon], {icon:L.divIcon({className:"", html:`<div class="pin">${i+1}</div>`, iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14]})})
      .bindPopup(popupHtml(s.p, s.c)).addTo(layer);
    m.on("popupopen", () => hl(s.p.n, true)).on("popupclose", () => hl(s.p.n, false));
    markers.set(s.p.n, m);
  });
  map.flyToBounds(L.latLngBounds(pts).pad(.15), {duration:.6});
}
function hl(name, on){
  view.querySelectorAll("li[data-place]").forEach(li => { if (li.dataset.place === name) { li.classList.toggle("on", on); if (on) li.scrollIntoView({block:"nearest", behavior:"smooth"}); } });
  const m = markers.get(name);
  m && m.getElement() && m.getElement().querySelector(".pin")?.classList.toggle("on", on);
}

function filtered(){
  const q = state.q.trim().toLowerCase().normalize("NFD").replace(/\p{M}/gu, "");
  return DATA.places.filter(p => {
    if (state.onlyFav && !favs.has(p.n)) return false;
    if (state.lists.length && !p.l.some(id => state.lists.includes(id))) return false;
    if (q){
      const hay = (p.n + " " + p.notes.join(" ")).toLowerCase().normalize("NFD").replace(/\p{M}/gu, "");
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderExplore(){
  view.innerHTML = `
    <input class="search" id="q" type="search" placeholder="Buscar sitio o palabra (beer, view, cheap…)" value="${esc(state.q)}">
    <div class="chips">
      <button class="chip" id="fav" aria-pressed="${state.onlyFav}">★ Favoritos</button>
      ${DATA.lists.map(l => `<button class="chip${l.id === BAD ? " danger" : ""}" data-list="${l.id}" aria-pressed="${state.lists.includes(l.id)}" title="${esc(l.title)}">${l.emoji} ${esc(l.name)}</button>`).join("")}
    </div>
    <div class="count"><span id="cnt"></span><button id="clr">Limpiar filtros</button></div>
    <ul class="res" id="res"></ul>`;
  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value; drawExplore(true); };
  document.getElementById("fav").onclick = e => { state.onlyFav = !state.onlyFav; e.currentTarget.setAttribute("aria-pressed", state.onlyFav); save(); drawExplore(true); };
  view.querySelectorAll("[data-list]").forEach(b => b.onclick = () => {
    const id = b.dataset.list;
    state.lists = state.lists.includes(id) ? state.lists.filter(x => x !== id) : [...state.lists, id];
    b.setAttribute("aria-pressed", state.lists.includes(id)); save(); drawExplore(true);
  });
  document.getElementById("clr").onclick = () => { state.q = ""; state.lists = []; state.onlyFav = false; save(); renderExplore(); };
  drawExplore(true);
}
function drawExplore(fit){
  const items = filtered();
  document.getElementById("cnt").textContent = `${items.length} sitios`;
  const sorted = [...items].sort((a, b) => b.l.length - a.l.length || a.n.localeCompare(b.n));
  document.getElementById("res").innerHTML = sorted.map(p => `
    <li data-place="${esc(p.n)}"><div style="flex:1;min-width:0">
      <div class="rn">${esc(p.n)}</div>
      <div class="rl">${p.l.map(id => L_BY_ID[id].emoji).join(" ")} ${p.l.length > 1 ? `· en ${p.l.length} listas` : ""}</div>
      ${p.notes[0] ? `<div class="rt">${esc(p.notes[0])}</div>` : ""}
    </div><button class="star" data-fav="${esc(p.n)}" aria-pressed="${favs.has(p.n)}" title="Favorito">★</button></li>`).join("");
  document.querySelectorAll("#res li").forEach(li => li.onclick = () => focusPlace(li.dataset.place));
  layer.clearLayers(); markers.clear();
  items.forEach(p => {
    const cls = p.l.includes(BAD) ? "dot bad" : favs.has(p.n) ? "dot fav" : "dot";
    const m = L.marker([p.lat, p.lon], {icon:L.divIcon({className:"", html:`<div class="${cls}"></div>`, iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]})})
      .bindPopup(popupHtml(p)).addTo(layer);
    markers.set(p.n, m);
  });
  if (fit && items.length) {
    const b = L.latLngBounds(items.map(p => [p.lat, p.lon]));
    items.length === 1 ? map.flyTo(b.getCenter(), 16, {duration:.5}) : map.flyToBounds(b.pad(.05), {duration:.5, maxZoom:16});
  }
}

function renderInfo(){
  const top = DATA.places.filter(p => p.l.filter(id => id !== BAD).length >= 3).sort((a, b) => b.l.length - a.l.length);
  const link = n => `<span class="lnk" data-go="${esc(n)}">${esc(n)}</span>`;
  view.innerHTML = `
    <div class="card"><h3>⭐ Los que más se repiten</h3>
      <p class="intro" style="margin-bottom:6px">Aparecen en 3 o más listas: sus favoritos de verdad.</p>
      <ul>${top.map(p => `<li>${link(p.n)} <span class="rl">(${p.l.length} listas)</span></li>`).join("")}</ul></div>
    <div class="card"><h3>🍂 Avisos de temporada</h3><ul>
      <li>Solo en verano: ${link("Angelato")}, ${link("Caravana cafebar")} y ${link("Školní jídelna Dražického náměstí")}.</li>
      <li>${link("Kryt Folimanka")}: solo el 2º sábado de cada mes, de 9 a 15 h.</li>
      <li>${link("Vítkov")}: cierra los lunes.</li>
      <li>${link("Klub Techniků")}: solo entre semana. ${link("Museum of Public Transport")}: solo fines de semana.</li>
      <li>${link("Church of Our Lady before Týn")}: gratis de 10 a 13 h y de 15 a 17 h.</li>
      <li>${link("Café Imperial")}: reserva sí o sí.</li></ul></div>
    <div class="card danger"><h3>❌ Qué evitar</h3><ul>
      <li>Casas de cambio "Best and Fast" (rojas) y la ${link("Casa de cambio Václavské nám. 21")}. Cambia en las verdes o saca del cajero de un banco.</li>
      <li>${link("Švejkova kavárna")}, ${link("Pizzerie Mistic")} y ${link("Restaurant@caffé")} en las escaleras del castillo.</li>
      <li>La fruta al peso de ${link("Havelské tržiště")} (unos 20 € la cesta) y ${link("Old Prague Market")}.</li>
      <li>El trdelník: "los locales lo odian". Mejor helado en ${link("Crème de la Crème")}.</li></ul></div>
    <div class="card"><h3>🗺️ Las 20 listas originales</h3><ul>
      ${DATA.lists.map(l => `<li><a href="${l.url}" target="_blank" rel="noopener">${l.emoji} ${esc(l.title.replace(/^\S+\s/, ""))}</a></li>`).join("")}</ul></div>`;
  view.querySelectorAll("[data-go]").forEach(s => s.onclick = () => showOne(s.dataset.go));
  drawAllDim();
}
function drawAllDim(){
  layer.clearLayers(); markers.clear();
  DATA.places.forEach(p => {
    const cls = p.l.includes(BAD) ? "dot bad" : favs.has(p.n) ? "dot fav" : "dot";
    const m = L.marker([p.lat, p.lon], {icon:L.divIcon({className:"", html:`<div class="${cls}"></div>`, iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]})})
      .bindPopup(popupHtml(p)).addTo(layer);
    markers.set(p.n, m);
  });
}
function showOne(n){ focusPlace(n); if (matchMedia("(max-width:820px)").matches) window.scrollTo({top:0, behavior:"smooth"}); }

render();
</script>
